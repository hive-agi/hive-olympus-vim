name: test

# The hermetic suite only. It resolves entirely from Clojars, so it runs on a
# clean checkout with no sibling working trees present.
#
# Not gated: the :dev real-Vim e2e. hive-vim is unpublished, so the stub-fidelity check announces a SKIP in this run rather than passing silently. No release job; the brick is a manifest with no src/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Test
        run: clojure -M:test
